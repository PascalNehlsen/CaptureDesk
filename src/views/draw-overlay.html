<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        /* rgba(0,0,0,0.01) = 1% opacity: invisible to the eye but forces X11
           to deliver mouse events to transparent windows (X11 only fires
           pointer events on areas with actual painted pixels otherwise). */
        background: rgba(0, 0, 0, 0.01);
        cursor: crosshair;
      }
      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="draw-canvas"></canvas>

    <script>
      const canvas = document.getElementById("draw-canvas");
      const ctx = canvas.getContext("2d");

      // This overlay spans the whole virtual desktop, so one canvas has to
      // serve every monitor. window.devicePixelRatio only reports the scale of
      // the display the window opened on, so the main process passes the
      // highest scale factor across all displays — strokes then stay crisp on
      // a HiDPI monitor instead of being upscaled from the lowest one.
      const params = new URLSearchParams(location.search);
      const dpr = Math.max(Number(params.get("dpr")) || 0, window.devicePixelRatio || 1, 1);
      const logicalW = window.innerWidth;
      const logicalH = window.innerHeight;

      canvas.width = Math.round(logicalW * dpr);
      canvas.height = Math.round(logicalH * dpr);
      ctx.scale(dpr, dpr);

      // Offscreen canvas: permanent layer of all completed strokes.
      const bgCanvas = new OffscreenCanvas(canvas.width, canvas.height);
      const bgCtx = bgCanvas.getContext("2d");
      bgCtx.scale(dpr, dpr);

      // ── State ──────────────────────────────────────────────────────
      let currentTool = "pen";
      let currentColor = "#ef4444";
      let lineWidth = 4;
      let isDrawing = false;
      let startX = 0;
      let startY = 0;
      let currentPath = [];

      // Points arriving since the last repaint, and the live end point for
      // shape tools. Input can fire far more often than the display refreshes,
      // so both are drained once per frame instead of once per event.
      let queuedPoints = [];
      let shapeEnd = null;
      let rafId = 0;

      // Store completed strokes for undo
      const strokes = [];

      const FREEHAND_TOOLS = ["pen", "highlighter", "eraser"];

      function isFreehand(tool) {
        return FREEHAND_TOOLS.indexOf(tool) !== -1;
      }

      // The highlighter paints at 0.35 alpha, so re-stroking a path that is
      // still growing darkens it at every overlap. It is therefore redrawn
      // from scratch over a blit of the committed layer each frame, like the
      // shape tools. Pen and eraser are idempotent at full alpha and can draw
      // just the new segment, which keeps their cost per frame constant.
      function needsFullRedraw(tool) {
        return tool === "highlighter" || tool === "arrow" || tool === "rect";
      }

      // ── Helpers ────────────────────────────────────────────────────
      function applyToolStyle(context, tool, color, lw) {
        context.lineCap = "round";
        context.lineJoin = "round";
        if (tool === "eraser") {
          context.globalCompositeOperation = "destination-out";
          context.strokeStyle = "rgba(0,0,0,1)";
          context.lineWidth = lw * 3;
        } else if (tool === "highlighter") {
          context.globalCompositeOperation = "source-over";
          context.globalAlpha = 0.35;
          context.strokeStyle = color;
          context.lineWidth = lw * 4;
        } else {
          context.globalCompositeOperation = "source-over";
          context.strokeStyle = color;
          context.lineWidth = lw;
        }
      }

      // bgCanvas is sized in device pixels while ctx carries the dpr
      // transform, so the destination size has to be given in logical units.
      function blitBackground() {
        ctx.clearRect(0, 0, logicalW, logicalH);
        ctx.drawImage(bgCanvas, 0, 0, logicalW, logicalH);
      }

      function strokePath(context, points) {
        if (points.length < 2) return;
        context.beginPath();
        context.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
          context.lineTo(points[i].x, points[i].y);
        }
        context.stroke();
      }

      // Draws a stroke to any context — used for bgCtx persistence and undo replay.
      function drawStroke(context, stroke) {
        context.save();
        applyToolStyle(context, stroke.tool, stroke.color, stroke.lineWidth);

        if (isFreehand(stroke.tool)) {
          strokePath(context, stroke.points);
        } else if (stroke.tool === "arrow") {
          drawArrowShape(context, stroke.x1, stroke.y1, stroke.x2, stroke.y2, stroke.lineWidth, stroke.color);
        } else if (stroke.tool === "rect") {
          context.strokeStyle = stroke.color;
          context.lineWidth = stroke.lineWidth;
          context.strokeRect(stroke.x1, stroke.y1, stroke.x2 - stroke.x1, stroke.y2 - stroke.y1);
        }

        context.restore();
      }

      // Rebuilds bgCanvas from scratch then copies to ctx. Only called on undo.
      function redrawAll() {
        bgCtx.clearRect(0, 0, logicalW, logicalH);
        strokes.forEach((s) => drawStroke(bgCtx, s));
        blitBackground();
      }

      function drawArrowShape(c, x1, y1, x2, y2, lw, color) {
        const angle = Math.atan2(y2 - y1, x2 - x1);
        const headLen = Math.max(14, lw * 4);
        c.save();
        c.strokeStyle = color;
        c.lineWidth = lw;
        c.lineCap = "round";
        c.beginPath();
        c.moveTo(x1, y1);
        c.lineTo(x2, y2);
        c.stroke();
        c.beginPath();
        c.moveTo(x2, y2);
        c.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
        c.moveTo(x2, y2);
        c.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
        c.stroke();
        c.restore();
      }

      // ── Per-frame rendering ────────────────────────────────────────
      function renderFrame() {
        rafId = 0;
        if (!isDrawing) return;

        if (isFreehand(currentTool)) {
          if (queuedPoints.length === 0) return;
          const appended = queuedPoints;
          queuedPoints = [];

          if (needsFullRedraw(currentTool)) {
            // Highlighter: commit nothing yet, just preview the whole path.
            for (const point of appended) currentPath.push(point);
            blitBackground();
            ctx.save();
            applyToolStyle(ctx, currentTool, currentColor, lineWidth);
            strokePath(ctx, currentPath);
            ctx.restore();
            return;
          }

          // Pen and eraser: stroke only the segment added since last frame,
          // starting from the previous end point so there is no gap.
          const segment = [currentPath[currentPath.length - 1]].concat(appended);
          for (const point of appended) currentPath.push(point);

          for (const context of [ctx, bgCtx]) {
            context.save();
            applyToolStyle(context, currentTool, currentColor, lineWidth);
            strokePath(context, segment);
            context.restore();
          }
          return;
        }

        if (!shapeEnd) return;
        blitBackground();
        if (currentTool === "arrow") {
          drawArrowShape(ctx, startX, startY, shapeEnd.x, shapeEnd.y, lineWidth, currentColor);
        } else if (currentTool === "rect") {
          ctx.save();
          ctx.strokeStyle = currentColor;
          ctx.lineWidth = lineWidth;
          ctx.strokeRect(startX, startY, shapeEnd.x - startX, shapeEnd.y - startY);
          ctx.restore();
        }
      }

      function scheduleFrame() {
        if (!rafId) rafId = requestAnimationFrame(renderFrame);
      }

      // ── Pointer events ─────────────────────────────────────────────
      // Listen on window (not canvas) so events fire even when the canvas
      // has no painted pixels yet — important for transparent windows on X11.
      window.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        isDrawing = true;
        startX = event.clientX;
        startY = event.clientY;
        currentPath = [{ x: event.clientX, y: event.clientY }];
        queuedPoints = [];
        shapeEnd = null;
        try {
          canvas.setPointerCapture(event.pointerId);
        } catch {
          // Best-effort; window-level listeners still cover the common case.
        }
      });

      window.addEventListener("pointermove", (event) => {
        if (!isDrawing) return;

        if (isFreehand(currentTool)) {
          // Coalesced events carry the input samples the browser merged into
          // this one, so a high-polling-rate mouse keeps its full precision
          // while still costing a single repaint.
          const coalesced = typeof event.getCoalescedEvents === "function"
            ? event.getCoalescedEvents()
            : [];
          const samples = coalesced.length > 0 ? coalesced : [event];
          for (const sample of samples) {
            queuedPoints.push({ x: sample.clientX, y: sample.clientY });
          }
        } else {
          shapeEnd = { x: event.clientX, y: event.clientY };
        }

        scheduleFrame();
      });

      function finishStroke(event) {
        if (!isDrawing) return;
        isDrawing = false;

        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = 0;
        }

        if (isFreehand(currentTool)) {
          for (const point of queuedPoints) currentPath.push(point);
          queuedPoints = [];
          if (currentPath.length >= 2) {
            const stroke = { tool: currentTool, color: currentColor, lineWidth, points: currentPath };
            strokes.push(stroke);
            // Pen and eraser already drew into bgCtx incrementally; the
            // highlighter was only ever previewed, so commit it now.
            if (needsFullRedraw(currentTool)) drawStroke(bgCtx, stroke);
          }
          blitBackground();
        } else {
          const end = shapeEnd || { x: event ? event.clientX : startX, y: event ? event.clientY : startY };
          if (end.x !== startX || end.y !== startY) {
            const stroke = {
              tool: currentTool, color: currentColor, lineWidth,
              x1: startX, y1: startY, x2: end.x, y2: end.y,
            };
            strokes.push(stroke);
            drawStroke(bgCtx, stroke);
          }
          blitBackground();
        }

        currentPath = [];
        shapeEnd = null;

        if (window.electronAPI?.requestRaiseOverlayUi) {
          window.electronAPI.requestRaiseOverlayUi();
        }
      }

      window.addEventListener("pointerup", finishStroke);
      window.addEventListener("pointercancel", finishStroke);
      // The pointer left the entire desktop overlay → finish the stroke.
      window.addEventListener("pointerleave", finishStroke);

      // ── IPC from controls window (via main process) ────────────────
      if (window.electronAPI) {
        if (typeof window.electronAPI.onClearDraw === "function") {
          window.electronAPI.onClearDraw(() => {
            strokes.length = 0;
            bgCtx.clearRect(0, 0, logicalW, logicalH);
            ctx.clearRect(0, 0, logicalW, logicalH);
          });
        }
        if (typeof window.electronAPI.onUndoDraw === "function") {
          window.electronAPI.onUndoDraw(() => {
            strokes.pop();
            redrawAll();
          });
        }
        if (typeof window.electronAPI.onDrawTool === "function") {
          window.electronAPI.onDrawTool((tool) => { currentTool = tool; });
        }
        if (typeof window.electronAPI.onDrawColor === "function") {
          window.electronAPI.onDrawColor((color) => { currentColor = color; });
        }
        if (typeof window.electronAPI.onDrawSize === "function") {
          window.electronAPI.onDrawSize((size) => { lineWidth = size; });
        }
      }

      // Keyboard Undo (Ctrl+Z)
      window.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "z") {
          e.preventDefault();
          strokes.pop();
          redrawAll();
        }
      });
    </script>
  </body>
</html>
