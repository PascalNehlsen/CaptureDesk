<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body {
        /* The window drives the size — the main process resizes it, so the
           circle follows without the page knowing any pixel values. */
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        /* Dragging is driven manually from the main process — see the script
           below — so the OS drag region must stay off. */
        -webkit-app-region: no-drag;
        cursor: grab;
        user-select: none;
      }
      body.dragging {
        cursor: grabbing;
      }
      #cam,
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
        transform: scaleX(-1);
        pointer-events: none;
      }
      /* Only one of the two is visible: the raw feed when blur is off, the
         composited canvas when it is on. */
      #stage { display: none; }
      body.blurred #cam { visibility: hidden; }
      body.blurred #stage { display: block; }
    </style>
  </head>
  <body title="Ziehen zum Verschieben · Scrollen ändert die Größe · Doppelklick setzt zurück">
    <video id="cam" autoplay muted playsinline></video>
    <canvas id="stage"></canvas>
    <script type="module">
      const api = window.electronAPI;

      // ── Device lifecycle ──────────────────────────────────────────
      // The window is only hidden between recordings, so the stream has to be
      // released explicitly — otherwise the camera (and its LED) stays on for
      // the whole session. `wanted` guards the case where a suspend arrives
      // while getUserMedia is still pending.
      const video = document.getElementById("cam");
      let stream = null;
      let pending = null;
      let wanted = false;

      function releaseStream(target) {
        for (const track of target.getTracks()) track.stop();
      }

      function startCamera() {
        wanted = true;
        if (stream || pending) return;
        pending = navigator.mediaDevices
          .getUserMedia({ video: true, audio: false })
          .then((next) => {
            if (!wanted) {
              releaseStream(next);
              return;
            }
            stream = next;
            video.srcObject = next;
            if (blurEnabled) startBlurLoop();
          })
          .catch((err) => {
            console.error("Camera error:", err);
          })
          .finally(() => {
            pending = null;
          });
      }

      function stopCamera() {
        wanted = false;
        stopBlurLoop();
        if (!stream) return;
        releaseStream(stream);
        stream = null;
        video.srcObject = null;
      }

      startCamera();
      api?.onCameraSuspend?.(stopCamera);
      api?.onCameraResume?.(startCamera);

      // ── Background blur ───────────────────────────────────────────
      // MediaPipe segments the person out of each frame; the background is
      // then drawn blurred and the person composited back on top sharp. The
      // runtime and model are served locally, so this works offline.
      const BLUR_PX = 12;
      // The model runs at 256x256 regardless, so there is nothing to gain from
      // compositing at more than the bubble's own resolution.
      const STAGE_SIZE = 480;

      const stage = document.getElementById("stage");
      const stageCtx = stage.getContext("2d");
      stage.width = STAGE_SIZE;
      stage.height = STAGE_SIZE;

      // Person layer, built separately so the mask can cut it out before it
      // goes over the blurred background.
      const personCanvas = new OffscreenCanvas(STAGE_SIZE, STAGE_SIZE);
      const personCtx = personCanvas.getContext("2d");
      const maskCanvas = new OffscreenCanvas(1, 1);
      const maskCtx = maskCanvas.getContext("2d");

      let blurEnabled = false;
      let segmenter = null;
      let segmenterLoading = null;
      let frameHandle = 0;
      let maskImageData = null;

      // Every start/stop bumps the token so a loop that is still in flight
      // exits instead of running alongside its replacement.
      let loopToken = 0;
      let lastFrameAt = 0;
      let watchdog = 0;
      let restartsLeft = 3;
      let loggedFrameError = false;
      let loggedFirstFrame = false;
      let activeDelegate = "unknown";

      // MediaPipe rejects a VIDEO-mode timestamp that does not strictly
      // increase. Deriving it from a counter rather than passing the frame
      // clock through removes that failure mode entirely.
      let lastTimestamp = 0;

      // If no frame lands for this long the canvas is stale, so the raw camera
      // goes back on screen rather than showing a frozen picture.
      const STALL_MS = 1500;

      async function loadSegmenter() {
        if (segmenter) return segmenter;
        if (segmenterLoading) return segmenterLoading;

        segmenterLoading = (async () => {
          const { FilesetResolver, ImageSegmenter } = await import(
            "/assets/vendor/tasks-vision/vision_bundle.mjs"
          );
          const fileset = await FilesetResolver.forVisionTasks("/assets/vendor/tasks-vision");
          const options = (delegate) => ({
            baseOptions: {
              modelAssetPath: "/assets/vendor/models/selfie_segmenter.tflite",
              delegate,
            },
            runningMode: "VIDEO",
            // The confidence mask carries a real gradient at the silhouette
            // (~3400 px between 0.15 and 0.85 on a typical frame); the binary
            // category mask throws that away and leaves a stair-stepped edge.
            outputCategoryMask: false,
            outputConfidenceMasks: true,
          });

          try {
            segmenter = await ImageSegmenter.createFromOptions(fileset, options("GPU"));
            activeDelegate = "GPU";
          } catch (err) {
            // The GPU delegate shares a context with the capture pipeline and
            // can fail while a recording is running; CPU is slower but safe.
            console.warn("[CaptureDesk] Blur GPU delegate unavailable, falling back to CPU:", err.message);
            segmenter = await ImageSegmenter.createFromOptions(fileset, options("CPU"));
            activeDelegate = "CPU";
          }
          return segmenter;
        })();

        try {
          return await segmenterLoading;
        } catch (err) {
          console.warn("[CaptureDesk] Background blur unavailable:", err.message || err);
          segmenterLoading = null;
          showRawCamera();
          return null;
        }
      }

      // The confidence mask is the per-pixel probability that the pixel is
      // part of the person. Polarity was checked rather than assumed: a
      // uniform grey image, which cannot contain a person, comes back as
      // 0.000 everywhere.
      //
      // Values below LOW become pure background and above HIGH pure person;
      // in between the alpha ramps smoothly. Without that remap the low
      // confidence spread across the background would leave a sharp ghost of
      // the room bleeding through the blur.
      // Measured across a fixed 60-frame sequence: widening this band to
      // 0.3/0.7 puts 3.9% of the frame at partial alpha instead of 1.0%,
      // which reads as a haze of the sharp room bleeding through the blur,
      // and buys no reduction in flicker. The visible softness comes from
      // the geometric feather below instead, which gives an even border
      // rather than a probability smear.
      const MASK_LOW = 0.45;
      const MASK_HIGH = 0.55;
      // Each frame is segmented independently, so the silhouette jitters.
      // Blending into the previous frame's mask trades ~130ms of lag for a
      // stable edge and cuts frame-to-frame mask churn by 2.8x.
      const MASK_SMOOTHING = 0.25;
      // Softens the silhouette as the 256px mask is scaled up to the bubble.
      const MASK_FEATHER_PX = 3;

      let maskSmoothed = null;

      function resetMaskSmoothing() {
        maskSmoothed = null;
      }

      function maskToAlpha(mask) {
        const { width, height } = mask;
        if (maskCanvas.width !== width || maskCanvas.height !== height) {
          maskCanvas.width = width;
          maskCanvas.height = height;
          maskImageData = maskCtx.createImageData(width, height);
          maskSmoothed = null;
        }

        const confidence = mask.getAsFloat32Array();
        if (!maskSmoothed || maskSmoothed.length !== confidence.length) {
          // First frame after a (re)start: adopt it as-is so the bubble does
          // not fade in from an empty mask.
          maskSmoothed = Float32Array.from(confidence);
        } else {
          for (let i = 0; i < confidence.length; i++) {
            maskSmoothed[i] += (confidence[i] - maskSmoothed[i]) * MASK_SMOOTHING;
          }
        }

        const span = MASK_HIGH - MASK_LOW;
        const pixels = maskImageData.data;
        for (let i = 0, p = 3; i < maskSmoothed.length; i++, p += 4) {
          const t = (maskSmoothed[i] - MASK_LOW) / span;
          const clamped = t < 0 ? 0 : t > 1 ? 1 : t;
          // Smoothstep: eases both ends of the ramp so the transition has no
          // visible start and stop.
          pixels[p] = (clamped * clamped * (3 - 2 * clamped) * 255) | 0;
        }
        maskCtx.putImageData(maskImageData, 0, 0);
      }

      // Cover-fit the (usually 4:3) camera frame into the square bubble, the
      // same way object-fit: cover does for the raw <video>.
      function coverRect(srcW, srcH, size) {
        const scale = Math.max(size / srcW, size / srcH);
        const drawW = srcW * scale;
        const drawH = srcH * scale;
        return { x: (size - drawW) / 2, y: (size - drawH) / 2, w: drawW, h: drawH };
      }

      // Returns true when a blurred frame actually made it onto the canvas.
      function renderBlurredFrame() {
        const srcW = video.videoWidth;
        const srcH = video.videoHeight;
        if (!segmenter || !srcW || !srcH) return false;

        lastTimestamp = lastTimestamp + 1;
        const result = segmenter.segmentForVideo(video, lastTimestamp);
        const mask = result?.confidenceMasks?.[0];
        if (!mask) return false;

        try {
          const fit = coverRect(srcW, srcH, STAGE_SIZE);

          // 1. Blurred background across the whole bubble.
          stageCtx.save();
          stageCtx.filter = `blur(${BLUR_PX}px)`;
          stageCtx.drawImage(video, fit.x, fit.y, fit.w, fit.h);
          stageCtx.restore();

          // 2. Person layer: the mask cuts the sharp frame to shape. The
          // feather blur is applied while scaling the mask up, so the cut
          // itself is soft rather than the edge being softened afterwards.
          maskToAlpha(mask);
          personCtx.clearRect(0, 0, STAGE_SIZE, STAGE_SIZE);
          personCtx.save();
          personCtx.filter = `blur(${MASK_FEATHER_PX}px)`;
          personCtx.drawImage(maskCanvas, fit.x, fit.y, fit.w, fit.h);
          personCtx.restore();
          personCtx.globalCompositeOperation = "source-in";
          personCtx.drawImage(video, fit.x, fit.y, fit.w, fit.h);
          personCtx.globalCompositeOperation = "source-over";

          // 3. Person over background.
          stageCtx.drawImage(personCanvas, 0, 0);
        } finally {
          mask.close();
        }
        return true;
      }

      function showBlurredCanvas() {
        document.body.classList.add("blurred");
      }

      function showRawCamera() {
        document.body.classList.remove("blurred");
      }

      // requestVideoFrameCallback ties the work to actual camera frames, so a
      // 30fps feed costs 30 segmentations instead of 60.
      function scheduleFrame(token) {
        if (!blurEnabled || token !== loopToken) return;

        const step = () => {
          if (!blurEnabled || token !== loopToken) return;
          try {
            if (renderBlurredFrame()) {
              lastFrameAt = performance.now();
              if (!loggedFirstFrame) {
                loggedFirstFrame = true;
                console.warn(`[CaptureDesk] Blur active (${activeDelegate} delegate)`);
              }
              // The canvas only takes over once it holds a real frame, so
              // enabling blur can never swap live video for a stale picture.
              showBlurredCanvas();
            }
          } catch (err) {
            // A single bad frame must not take the loop down with it.
            if (!loggedFrameError) {
              loggedFrameError = true;
              console.warn("[CaptureDesk] Blur frame failed:", err.message || err);
            }
          }
          scheduleFrame(token);
        };

        if (typeof video.requestVideoFrameCallback === "function") {
          frameHandle = video.requestVideoFrameCallback(step);
        } else {
          frameHandle = requestAnimationFrame(step);
        }
      }

      function startWatchdog() {
        if (watchdog) return;
        watchdog = setInterval(() => {
          if (!blurEnabled || !lastFrameAt) return;
          if (performance.now() - lastFrameAt <= STALL_MS) return;

          showRawCamera();
          if (restartsLeft > 0) {
            restartsLeft--;
            console.warn("[CaptureDesk] Blur stalled; restarting the loop");
            lastFrameAt = 0;
            loopToken++;
            scheduleFrame(loopToken);
          } else {
            console.warn("[CaptureDesk] Blur kept stalling; staying on the raw camera");
            blurEnabled = false;
          }
        }, 500);
      }

      function stopWatchdog() {
        if (!watchdog) return;
        clearInterval(watchdog);
        watchdog = 0;
      }

      async function startBlurLoop() {
        if (!blurEnabled) return;
        // Only start once there is something to segment; startCamera() calls
        // back in here as soon as the stream lands.
        if (!stream) return;

        const ready = await loadSegmenter();
        if (!ready || !blurEnabled) return;

        loopToken++;
        lastFrameAt = performance.now();
        startWatchdog();
        scheduleFrame(loopToken);
      }

      function stopBlurLoop() {
        loopToken++;
        stopWatchdog();
        resetMaskSmoothing();
        // Whatever is on the canvas is now stale, so the live feed goes back
        // on screen until a fresh blurred frame replaces it.
        showRawCamera();
        if (frameHandle) {
          if (typeof video.cancelVideoFrameCallback === "function") {
            video.cancelVideoFrameCallback(frameHandle);
          } else {
            cancelAnimationFrame(frameHandle);
          }
          frameHandle = 0;
        }
        lastFrameAt = 0;
      }

      function setBlurEnabled(enabled) {
        const next = !!enabled;
        if (next === blurEnabled) return;
        blurEnabled = next;

        if (blurEnabled) {
          restartsLeft = 3;
          loggedFrameError = false;
          startBlurLoop();
        } else {
          stopBlurLoop();
          showRawCamera();
          stageCtx.clearRect(0, 0, STAGE_SIZE, STAGE_SIZE);
        }
      }

      api?.onBackgroundBlurChanged?.(setBlurEnabled);

      // ── Dragging ──────────────────────────────────────────────────
      // `-webkit-app-region: drag` is unreliable for transparent, toolbar-type
      // windows on X11, so the position is applied in the main process from
      // screen-space pointer deltas. `screenX/screenY` are cursor coordinates
      // and therefore unaffected by the window moving underneath; pointer
      // capture keeps events flowing when the cursor outruns the window.
      // Moves are coalesced to one IPC message per frame.
      let dragStart = null;
      let pendingDelta = null;
      let rafId = 0;

      function flushDelta() {
        rafId = 0;
        if (!pendingDelta) return;
        api?.sendCameraDragMove?.(pendingDelta);
        pendingDelta = null;
      }

      document.body.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        dragStart = { x: event.screenX, y: event.screenY };
        pendingDelta = null;
        document.body.classList.add("dragging");
        try {
          document.body.setPointerCapture(event.pointerId);
        } catch {
          // Pointer capture is best-effort; dragging still works without it.
        }
        api?.sendCameraDragStart?.();
      });

      document.body.addEventListener("pointermove", (event) => {
        if (!dragStart) return;
        pendingDelta = { dx: event.screenX - dragStart.x, dy: event.screenY - dragStart.y };
        if (!rafId) rafId = requestAnimationFrame(flushDelta);
      });

      function endDrag() {
        if (!dragStart) return;
        dragStart = null;
        document.body.classList.remove("dragging");
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = 0;
        }
        flushDelta();
        api?.sendCameraDragEnd?.();
      }

      document.body.addEventListener("pointerup", endDrag);
      document.body.addEventListener("pointercancel", endDrag);
      window.addEventListener("blur", endDrag);

      // Scroll to resize. The step lives in the main process so the wheel and
      // the settings dropdown cannot drift apart.
      document.body.addEventListener(
        "wheel",
        (event) => {
          event.preventDefault();
          if (event.deltaY === 0) return;
          api?.sendCameraSizeStep?.(event.deltaY < 0 ? 1 : -1);
        },
        { passive: false },
      );

      // Double-click restores the default position and size.
      document.body.addEventListener("dblclick", () => {
        endDrag();
        api?.resetCameraPosition?.();
      });
    </script>
  </body>
</html>
