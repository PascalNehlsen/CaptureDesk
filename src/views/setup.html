<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self';"
    />
    <title>CaptureDesk einrichten</title>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

      :root {
        --bg-deep: #060a13;
        --accent: #6366f1;
        --accent-glow: rgba(99,102,241,0.35);
        --red: #ef4444;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --border: rgba(255,255,255,0.08);
      }

      html, body {
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        color: var(--text-primary);
        background: linear-gradient(145deg, #060a13 0%, #0f172a 40%, #0c1222 100%);
      }

      main {
        display: flex; flex-direction: column; gap: 18px;
        padding: 28px 32px;
      }

      .hero { display: flex; align-items: center; gap: 12px; }
      .hero img { width: 36px; height: 36px; }
      h1 { font-size: 20px; font-weight: 600; }

      p { font-size: 13px; line-height: 1.55; color: var(--text-secondary); }

      ol {
        font-size: 13px; line-height: 1.6; color: var(--text-secondary);
        padding-left: 20px;
      }

      a, .link-btn {
        color: #a5b4fc; text-decoration: underline; cursor: pointer;
        background: none; border: none; font: inherit; padding: 0;
      }

      label { font-size: 12px; color: var(--text-secondary); }

      input {
        width: 100%; margin-top: 6px;
        background: rgba(15, 23, 42, 0.85);
        color: var(--text-primary);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 9px 12px;
        font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
        font-size: 13px;
      }
      input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
      input[aria-invalid="true"] { border-color: var(--red); }

      .error { min-height: 18px; font-size: 12px; color: var(--red); }
      .hint { font-size: 12px; color: var(--text-muted); }

      .actions { display: flex; justify-content: flex-end; gap: 10px; }

      button.primary, button.secondary {
        border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer;
        border: 1px solid var(--border);
      }
      button.primary { background: var(--accent); color: #fff; border-color: transparent; }
      button.primary:disabled { opacity: 0.6; cursor: default; }
      button.secondary { background: rgba(255,255,255,0.04); color: var(--text-primary); }
    </style>
  </head>
  <body>
    <main>
      <div class="hero">
        <img src="../public/capturedesk.svg" alt="" />
        <h1>Loom App-ID</h1>
      </div>

      <p>CaptureDesk nimmt über das Loom Record SDK auf und braucht dafür die App-ID einer eigenen Loom-Developer-App. Das ist kostenlos.</p>

      <ol>
        <li>Im <button type="button" class="link-btn" id="portal-link">Loom Developer Portal</button> eine App anlegen.</li>
        <li>Die öffentliche App-ID kopieren (nicht den Private Key).</li>
        <li>Hier einfügen und speichern.</li>
      </ol>

      <form id="setup-form" novalidate>
        <label for="app-id">App-ID</label>
        <input id="app-id" name="app-id" autocomplete="off" spellcheck="false" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" />
        <p class="error" id="error" role="alert"></p>
        <p class="hint" id="config-path"></p>
      </form>

      <div class="actions">
        <button type="button" class="secondary" id="cancel-btn">Abbrechen</button>
        <button type="submit" class="primary" id="save-btn" form="setup-form">Speichern</button>
      </div>
    </main>

    <script src="../public/setup.js"></script>
  </body>
</html>
