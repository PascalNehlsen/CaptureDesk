version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      electron:
        patterns:
          - "electron"
          - "electron-builder"
      loom-sdk:
        patterns:
          - "@loomhq/*"
      build-tools:
        patterns:
          - "esbuild"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
