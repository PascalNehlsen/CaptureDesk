name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan every Monday at 08:00 UTC
    - cron: "0 8 * * 1"

# The jobs only read the repository.
permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history so trufflehog can scan all commits

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          # Not --only-verified: that drops every secret TruffleHog cannot
          # confirm live, such as a revoked key, a key for a service with no
          # verifier, or one checked while the provider was down. In a public
          # repo a revoked key in history still says how keys get committed.
          extra_args: --results=verified,unknown,unverified

  audit-report:
    name: Full audit report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # On pushes and pull requests the CI workflow already fails on high and
      # critical findings. The weekly run needs the same gate: an advisory
      # published between commits otherwise stays green until the next push,
      # which in a repo this quiet can be weeks.
      - name: npm audit (high and above)
        if: github.event_name == 'schedule'
        run: npm audit --audit-level=high

      # Informational: lists every finding, including moderate ones.
      - name: npm audit (full report)
        if: always()
        run: npm audit || true
