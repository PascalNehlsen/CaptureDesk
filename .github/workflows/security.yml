name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, development]
  schedule:
    # Weekly scan every Monday at 08:00 UTC
    - cron: "0 8 * * 1"

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so trufflehog can scan all commits

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  audit-report:
    name: Full audit report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Informational — surfaces new issues without blocking the build.
      # The 3 known unfixable highs (GHSA-f23m-r3pf-42rh, GHSA-r5fr-rjxr-66jc)
      - name: npm audit (full report)
        run: npm audit || true
